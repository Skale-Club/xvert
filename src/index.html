<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Xvert</title>
  <link rel="stylesheet" href="skale.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="side">
    <div class="brand">
      <img src="logo.png" alt="">
      <div>
        <b>Xvert</b>
        <small data-t="tagline"></small>
      </div>
    </div>
    <nav id="nav"></nav>
    <button id="skale" class="skale" title="skale.club"><img src="skaleclub.png" alt=""><span><small data-t="madeBy"></small>Skale Club</span></button>
    <div class="side-foot">
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="es">Español</option>
      </select>
      <button class="ver ver-btn"></button>
    </div>
  </aside>
  <main>
    <div id="update-bar" hidden></div>
    <header>
      <div class="head-text">
        <h1 id="title"></h1>
        <div id="subtitle"></div>
      </div>
      <div id="actions"></div>
    </header>
    <div id="page"></div>
  </main>
  <div id="drop" hidden><div><span class="drop-ring"></span><b data-t="dropHere"></b></div></div>
  <div id="toast"></div>
  <script src="i18n.js"></script>
  <script src="updates.js"></script>
  <script src="app.js"></script>
</body>
</html>
